
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes - Simple Note Taking</title>

    <link rel="stylesheet" href="styling.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header>
        <div class="container">
            <h1>QuickNotes</h1>
            <p>Capture your thoughts, tasks and ideas in seconds.</p>
        </div>
    </header>

    <main>

        
        <section class="note-section">
            <h2>Add a Note</h2>

            <form id="note-form">

                <div class="form-group">
                    <label for="note-input">Your note</label>

                    <input
                        type="text"
                        id="note-input"
                        name="note"
                        placeholder="Type your note here..."
                        maxlength="200"
                    >
                </div>

                <div class="form-group">
                    <label for="note-category">Category</label>

                    <select id="note-category" name="category">
                        <option value="Personal">Personal</option>
                        <option value="Work">Work</option>
                        <option value="Study">Study</option>
                    </select>
                </div>

                <button type="submit">Add Note</button>
            </form>

            <p id="error-message" role="alert"></p>
        </section>


        
        <section class="note-section">
            <h2>Your Notes</h2>

            <div class="search-area">
                <label for="search-input">Search notes</label>

                <input
                    type="search"
                    id="search-input"
                    placeholder="Search your notes..."
                >
            </div>

            <p id="note-count">You have no notes yet.</p>

            <ul id="notes-list"></ul>

            <button id="clear-all-btn" type="button" class="clear-all">
                Clear All
            </button>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 QuickNotes. All rights reserved.</p>
    </footer>

</body>
</html>
